name: Squad Promote

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would happen without pushing'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  dev-to-preview:
    name: Promote dev → preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Show current state (dry run info)
        run: |
          echo "=== dev HEAD ===" && git log origin/dev -1 --oneline
          echo "=== preview HEAD ===" && git log origin/preview -1 --oneline
          echo "=== Files that would be stripped (.squad is kept) ==="
          git diff origin/preview..origin/dev --name-only | grep -E "^(\.(ai-team|ai-team-templates)/|team-docs/|docs/proposals/)" || echo "(none)"

      - name: Merge dev → preview (strip forbidden paths)
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          git checkout preview
          git merge origin/dev --no-commit --no-ff -X theirs || true

          # Strip forbidden paths from merge commit (.squad is kept — public-repo policy)
          git rm -rf --cached --ignore-unmatch \
            .ai-team/ \
            .ai-team-templates/ \
            team-docs/ \
            "docs/proposals/" || true

          # Derive version label from latest semver tag (falls back to 'untagged')
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)
          VERSION_LABEL="${LATEST_TAG:-untagged}"

          # Commit if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: promote dev → preview ($VERSION_LABEL)"
            git push origin preview
            echo "✅ Pushed preview branch"
          else
            echo "ℹ️ Nothing to commit — preview is already up to date"
          fi

      - name: Dry run complete
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "🔍 Dry run complete — no changes pushed."

  preview-to-main:
    name: Promote preview → main (release)
    needs: dev-to-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Show current state
        run: |
          echo "=== preview HEAD ===" && git log origin/preview -1 --oneline
          echo "=== main HEAD ===" && git log origin/main -1 --oneline
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)
          echo "=== Latest semver tag: ${LATEST_TAG:-'(none)'} ==="

      - name: Validate preview is release-ready
        run: |
          git checkout preview

          # Verify a semver tag exists — releases require an explicit tag
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No semver tag found — tag the repo with vMAJOR.MINOR.PATCH before releasing"
            exit 1
          fi
          echo "✅ Latest tag: $LATEST_TAG"

          # Verify no forbidden files on preview (.squad is allowed — public-repo policy)
          FORBIDDEN=$(git ls-files | grep -E "^(\.(ai-team|ai-team-templates)/|team-docs/|docs/proposals/)" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden files found on preview: $FORBIDDEN"
            exit 1
          fi
          echo "✅ No forbidden files on preview"

      - name: Merge preview → main
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)
          VERSION_LABEL="${LATEST_TAG:-untagged}"
          git checkout main
          git merge origin/preview --no-ff -m "chore: promote preview → main ($VERSION_LABEL)"
          git push origin main
          echo "✅ Pushed main — squad-release.yml will build, test, and create the GitHub Release from the matching tag"

      - name: Dry run complete
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "🔍 Dry run complete — no changes pushed."
