name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Validate, Build, Test & Release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.x'

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '\Av(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\z') {
            throw "Release tag must exactly match vMAJOR.MINOR.PATCH."
          }

      - name: Restore packages
        run: dotnet restore OpenClawNet.slnx --runtime win-x64

      - name: Build (Release)
        run: |
          dotnet build tests/OpenClawNet.UnitTests/OpenClawNet.UnitTests.csproj `
            --no-restore --configuration Release -r win-x64 -p:CopilotSkipCliDownload=true
          dotnet build tests/OpenClawNet.UnitTests.Azure/OpenClawNet.UnitTests.Azure.csproj `
            --no-restore --configuration Release -r win-x64 -p:CopilotSkipCliDownload=true

      - name: Unit Tests
        run: >
          dotnet test tests/OpenClawNet.UnitTests/OpenClawNet.UnitTests.csproj
          --no-build
          --configuration Release
          -r win-x64
          -p:CopilotSkipCliDownload=true
          --filter "Category!=Live"

      - name: Azure Unit Tests
        run: >
          dotnet test tests/OpenClawNet.UnitTests.Azure/OpenClawNet.UnitTests.Azure.csproj
          --no-build
          --configuration Release
          -r win-x64
          -p:CopilotSkipCliDownload=true

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:RELEASE_TAG" --generate-notes
